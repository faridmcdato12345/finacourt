services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-court_marketplace}
      DB_USERNAME: ${DB_USERNAME:-court}
      DB_PASSWORD: ${DB_PASSWORD:-court_secret}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: ["tools"]
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: php artisan test
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_TEST_DATABASE:-court_marketplace_test}
      DB_USERNAME: ${DB_USERNAME:-court}
      DB_PASSWORD: ${DB_PASSWORD:-court_secret}
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      GOOGLE_BUSINESS_PROFILE_ENABLED: "false"
      BCRYPT_ROUNDS: 4
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: php artisan schedule:work
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-court_marketplace}
      DB_USERNAME: ${DB_USERNAME:-court}
      DB_PASSWORD: ${DB_PASSWORD:-court_secret}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: php artisan queue:work --queue=emails,default --sleep=3 --tries=3 --backoff=10 --timeout=90 --max-time=3600
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-court_marketplace}
      DB_USERNAME: ${DB_USERNAME:-court}
      DB_PASSWORD: ${DB_PASSWORD:-court_secret}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - composer_vendor:/var/www/html/vendor:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-court_marketplace}
      MYSQL_USER: ${DB_USERNAME:-court}
      MYSQL_PASSWORD: ${DB_PASSWORD:-court_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:-court_marketplace_test}
    ports:
      - "${DB_PORT_FORWARD:-33060}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-test-database.sh:/docker-entrypoint-initdb.d/10-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules

volumes:
  composer_vendor:
  mysql_data:
  node_modules:
